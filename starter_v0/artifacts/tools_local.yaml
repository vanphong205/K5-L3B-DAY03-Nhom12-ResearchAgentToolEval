tools:
- name: clarify
  description: Ask one focused follow-up when essential information is missing. Use text for missing details; use
    yes_no to confirm an unapproved external action.
  parameters:
    type: object
    properties:
      question:
        type: string
        default: ''
        description: One specific missing detail to ask the user; do not bundle unrelated questions.
      response_type:
        type: string
        enum:
        - text
        - yes_no
        - choice
        default: text
        description: 'Always set this parameter explicitly: use text for ordinary missing details, yes_no to confirm
          an exact action before sending/publishing, and choice only when offering listed options.'
      options:
        type: array
        default: []
        items:
          type: string
        description: Short choices when response_type is choice; otherwise leave empty.
    required:
    - question
- name: timeline
  description: Get recent posts from one identified account. Use a real account handle without @. Do not use for
    topic search.
  parameters:
    type: object
    properties:
      screenname:
        type: string
        default: ''
        description: Account handle without @; use the stated handle or a well-supported mapping, and clarify when
          identity is ambiguous.
      limit:
        type: integer
        default: 5
        description: Number of recent posts requested; preserve the user's stated count, otherwise use 5.
    required:
    - screenname
- name: social_search
  description: Search public posts by topic or keywords. Do not use for one account timeline.
  parameters:
    type: object
    properties:
      query:
        type: string
        default: ''
        description: The user's topic or keywords; keep the requested subject without adding unrelated terms.
      search_type:
        type: string
        enum:
        - Latest
        - Top
        default: Latest
        description: Use Latest for newest posts or Top for most prominent posts; only these exact enum values are
          valid.
      limit:
        type: integer
        default: 5
        description: Number of posts requested; preserve the user's stated count, otherwise use 5.
    required:
    - query
- name: lookup
  description: Search the web. Set topic=news for news; keep the user?s subject in query and honor timeframe.
  parameters:
    type: object
    properties:
      query:
        type: string
        default: ''
        description: Search subject as requested; do not append the word 'news' when topic=news already expresses
          the news intent.
      topic:
        type: string
        enum:
        - general
        - news
        default: general
        description: Choose news for current/recent news coverage; otherwise general.
      timeframe:
        type: string
        enum:
        - day
        - week
        - month
        - year
        default: week
        description: Use the matching window only when specified or clearly required; day, week, month, or year.
      max_results:
        type: integer
        default: 5
        description: Maximum number of web results; preserve a user-stated count, otherwise use 5.
    required:
    - query
- name: fetch
  description: Read a specific user-provided or identified URL. Ask for the URL if it is missing.
  parameters:
    type: object
    properties:
      url:
        type: string
        default: ''
        description: Exact complete URL to read; do not invent or substitute a URL.
    required:
    - url
- name: format
  description: Format only items already present in context or tool results; do not search or invent sources.
  parameters:
    type: object
    properties:
      items:
        type: array
        default: []
        description: Existing result items only; preserve their facts and URLs.
        items:
          type: object
          properties:
            title:
              type: string
            url:
              type: string
            source:
              type: string
            summary:
              type: string
            section:
              type: string
      template:
        type: string
        enum:
        - brief
        - sections
        - bullets
        - thread
        - daily_ai_vn
        default: sections
        description: Choose brief, sections, bullets, thread, or daily_ai_vn to match the user's requested presentation.
      headline:
        type: string
        default: ''
        description: Optional concise heading requested by the user; otherwise leave empty.
    required:
    - items
    - template
- name: send
  description: Send only after clear confirmation of exact content and destination. Require confirmed=true.
  parameters:
    type: object
    properties:
      text:
        type: string
        default: ''
        description: Exact user-approved message to send; do not alter after confirmation.
      confirmed:
        type: boolean
        default: false
        description: Set true only after explicit user confirmation of this exact text and destination; otherwise
          do not call send.
    required:
    - text
- name: policy
  description: Search internal policy. Select the narrowest policy_area; use tool_usage for API limits and tool
    errors.
  parameters:
    type: object
    properties:
      query:
        type: string
        default: ''
        description: Concise policy question or terms to find.
      policy_area:
        type: string
        enum:
        - all
        - ai_research
        - source_citation
        - data_privacy
        - external_publishing
        - tool_usage
        default: all
        description: Restrict to the matching policy area, or all when the topic is unclear/broad.
      top_k:
        type: integer
        default: 3
        description: Maximum relevant policy excerpts to return; preserve a requested count, otherwise use 3.
    required:
    - query
- name: papers
  description: Search arXiv papers. Do not use for general web, code repositories, or social posts.
  parameters:
    type: object
    properties:
      query:
        type: string
        default: ''
        description: Research topic, title, author, or terms from the user's paper search.
      max_results:
        type: integer
        default: 5
        description: Maximum papers to return; preserve a user-stated count, otherwise use 5.
      sort_by:
        type: string
        enum:
        - relevance
        - lastUpdatedDate
        - submittedDate
        default: relevance
        description: Sort by relevance, last updated date, or submission date as requested.
    required:
    - query
- name: paper_text
  description: Read text from a specified arXiv paper.
  parameters:
    type: object
    properties:
      arxiv_url:
        type: string
        default: ''
        description: Specific arXiv identifier or arXiv URL; do not guess the paper.
      max_pages:
        type: integer
        default: 5
        description: Maximum PDF pages to read; preserve a stated limit, otherwise use 5.
      max_chars:
        type: integer
        default: 8000
        description: Maximum extracted characters; preserve a stated limit, otherwise use 8000.
    required:
    - arxiv_url
- name: github_search
  description: Search GitHub source-code repositories. Use for repositories and code projects, not papers or Hugging
    Face assets.
  parameters:
    type: object
    properties:
      query:
        type: string
        default: ''
        description: Repository keywords or project name from the user's request.
      language:
        type: string
        default: ''
        description: Optional programming-language filter (for example python); empty means no language filter.
      sort:
        type: string
        enum:
        - stars
        - forks
        - updated
        - best_match
        default: stars
        description: Sort by stars, forks, recent updates, or best match using one exact enum value.
      max_results:
        type: integer
        default: 5
        description: Number of repositories to return (1–10); default 5.
    required:
    - query
- name: hf_search
  description: Search Hugging Face models or datasets. Set kind to models or datasets; do not use for source-code
    repositories or papers.
  parameters:
    type: object
    properties:
      query:
        type: string
        default: ''
        description: Model, dataset, architecture, task, or keyword to search on the Hub.
      kind:
        type: string
        enum:
        - models
        - datasets
        default: models
        description: Search models or datasets; select datasets only when requested.
      sort:
        type: string
        enum:
        - downloads
        - likes
        - lastModified
        default: downloads
        description: Sort by downloads, likes, or most recently modified using one exact enum value.
      max_results:
        type: integer
        default: 5
        description: Number of Hub results to return (1–10); default 5.
    required:
    - query
